---
layout: default
---
<article class="post" itemscope itemtype="http://schema.org/BlogPosting">

  <header class="post-header">
    <h1 class="post-title" itemprop="name headline">{{ page.title }}</h1>
  </header>

  <div class="docked-title">
    <div class="wrapper">
      <button type="button" class="back-to-top" aria-label="Back to top">&uarr;</button>
      <p aria-hidden="true">{{ page.title }}</p>
    </div>
  </div>

  <script>
    (function () {
      var title = document.querySelector('.post-header .post-title');
      var docked = document.querySelector('.docked-title');
      var headerHeight = document.querySelector('.site-header').offsetHeight;

      new IntersectionObserver(function (entries) {
        docked.classList.toggle('is-visible', !entries[0].isIntersecting);
      }, { rootMargin: '-' + headerHeight + 'px 0px 0px 0px' }).observe(title);

      function backToTop() {
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
      }

      docked.querySelector('.back-to-top').addEventListener('click', backToTop);
      docked.querySelector('p').addEventListener('click', backToTop);
    })();
  </script>

  <div class="post-content" itemprop="articleBody">
    {% include heading-links.html html=content %}
  </div>

  <!-- <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%b %-d, %Y" }}</time>{% if page.author %} • <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span itemprop="name">{{ page.author }}</span></span>{% endif %}</p> -->

</article>

<div class="share">
  <a class="share-button blue" target="_blank"
    href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}+@{{ site.twitter_username | url_encode }}+{{ page.url | prepend: site.url | url_encode }}">Comment on Twitter</a>
</div>

<div class="read-more post-tag {{ page.tag }}">
  <a class="read-more-button" href="/tag/{{ page.tag }}">Read more on #{{ page.tag }}</a>
</div>

<div class="post_navigation">
  {% if page.previous.url %}
  <a class="prev" href="{{page.previous.url}}">&laquo; {{page.previous.title}}</a>
  {% endif %}
  {% if page.next.url %}
  <a class="next" href="{{page.next.url}}">{{page.next.title}} &raquo;</a>
  {% endif %}
</div>
